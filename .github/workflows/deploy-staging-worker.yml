name: Build and deploy cx1-admin-dev Worker

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-staging-worker.yml'
      - 'apps/backoffice/**'
      - 'contracts/**'
      - 'scripts/deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx1-admin-dev-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e5ddcd53fc8f6f1fbc5392d48aeb47d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --store-dir .pnpm-store
      - run: node --test apps/backoffice/tests/quotes.test.mjs
      - run: node scripts/deploy/build-worker.mjs
      - name: Deploy the tested build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          worker_dir="$(node -p "require('./.local/deployment/worker-build.json').directory")"
          cd "$worker_dir"
          node node_modules/wrangler/bin/wrangler.js deploy
      - name: Explain missing deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo 'Build passed; set CLOUDFLARE_API_TOKEN as a repository secret to enable deployment.'
